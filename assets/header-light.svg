<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .name-text {
        font-family: 'Courier New', 'Consolas', monospace;
        font-size: 36px;
        font-weight: bold;
        fill: #1f2328;
        letter-spacing: 2px;
      }
      .handle-text {
        font-family: 'Courier New', 'Consolas', monospace;
        font-size: 20px;
        fill: #656d76;
        letter-spacing: 4px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="200" rx="6"/>

  <!-- Scanlines overlay -->
  <g opacity="0.04" stroke="#1f2328" stroke-width="1">
    <line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="4" x2="800" y2="4"/>
    <line x1="0" y1="8" x2="800" y2="8"/><line x1="0" y1="12" x2="800" y2="12"/>
    <line x1="0" y1="16" x2="800" y2="16"/><line x1="0" y1="20" x2="800" y2="20"/>
    <line x1="0" y1="24" x2="800" y2="24"/><line x1="0" y1="28" x2="800" y2="28"/>
    <line x1="0" y1="32" x2="800" y2="32"/><line x1="0" y1="36" x2="800" y2="36"/>
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="44" x2="800" y2="44"/>
    <line x1="0" y1="48" x2="800" y2="48"/><line x1="0" y1="52" x2="800" y2="52"/>
    <line x1="0" y1="56" x2="800" y2="56"/><line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="64" x2="800" y2="64"/><line x1="0" y1="68" x2="800" y2="68"/>
    <line x1="0" y1="72" x2="800" y2="72"/><line x1="0" y1="76" x2="800" y2="76"/>
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="84" x2="800" y2="84"/>
    <line x1="0" y1="88" x2="800" y2="88"/><line x1="0" y1="92" x2="800" y2="92"/>
    <line x1="0" y1="96" x2="800" y2="96"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="104" x2="800" y2="104"/><line x1="0" y1="108" x2="800" y2="108"/>
    <line x1="0" y1="112" x2="800" y2="112"/><line x1="0" y1="116" x2="800" y2="116"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="124" x2="800" y2="124"/>
    <line x1="0" y1="128" x2="800" y2="128"/><line x1="0" y1="132" x2="800" y2="132"/>
    <line x1="0" y1="136" x2="800" y2="136"/><line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="144" x2="800" y2="144"/><line x1="0" y1="148" x2="800" y2="148"/>
    <line x1="0" y1="152" x2="800" y2="152"/><line x1="0" y1="156" x2="800" y2="156"/>
    <line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="164" x2="800" y2="164"/>
    <line x1="0" y1="168" x2="800" y2="168"/><line x1="0" y1="172" x2="800" y2="172"/>
    <line x1="0" y1="176" x2="800" y2="176"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="184" x2="800" y2="184"/><line x1="0" y1="188" x2="800" y2="188"/>
    <line x1="0" y1="192" x2="800" y2="192"/><line x1="0" y1="196" x2="800" y2="196"/>
  </g>

  <!-- Copper Bars - animated horizontal bars -->
  <g opacity="0.12">
    <rect x="0" width="800" height="3" fill="#1f2328">
      <animate attributeName="y" values="15;185;15" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" width="800" height="3" fill="#1f2328">
      <animate attributeName="y" values="25;175;25" dur="4s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite" begin="0.2s"/>
    </rect>
    <rect x="0" width="800" height="3" fill="#1f2328">
      <animate attributeName="y" values="35;165;35" dur="4s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="4s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    <rect x="0" width="800" height="3" fill="#1f2328">
      <animate attributeName="y" values="45;155;45" dur="4s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <rect x="0" width="800" height="3" fill="#1f2328">
      <animate attributeName="y" values="55;145;55" dur="4s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0.08;0.3;0.08" dur="4s" repeatCount="indefinite" begin="0.8s"/>
    </rect>
    <rect x="0" width="800" height="3" fill="#1f2328">
      <animate attributeName="y" values="65;135;65" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.06;0.25;0.06" dur="4s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <rect x="0" width="800" height="3" fill="#1f2328">
      <animate attributeName="y" values="75;125;75" dur="4s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" values="0.04;0.2;0.04" dur="4s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
    <rect x="0" width="800" height="3" fill="#1f2328">
      <animate attributeName="y" values="85;115;85" dur="4s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="opacity" values="0.03;0.15;0.03" dur="4s" repeatCount="indefinite" begin="1.4s"/>
    </rect>
  </g>

  <!-- Wormhole / Tunnel effect -->
  <g opacity="0.1">
    <ellipse cx="680" cy="100" fill="none" stroke="#1f2328" stroke-width="0.8">
      <animate attributeName="rx" values="3;130;3" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="3;85;3" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="680" cy="100" fill="none" stroke="#1f2328" stroke-width="0.8">
      <animate attributeName="rx" values="3;130;3" dur="6s" repeatCount="indefinite" begin="0.75s"/>
      <animate attributeName="ry" values="3;85;3" dur="6s" repeatCount="indefinite" begin="0.75s"/>
      <animate attributeName="opacity" values="1;0;1" dur="6s" repeatCount="indefinite" begin="0.75s"/>
    </ellipse>
    <ellipse cx="680" cy="100" fill="none" stroke="#1f2328" stroke-width="0.8">
      <animate attributeName="rx" values="3;130;3" dur="6s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="ry" values="3;85;3" dur="6s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="1;0;1" dur="6s" repeatCount="indefinite" begin="1.5s"/>
    </ellipse>
    <ellipse cx="680" cy="100" fill="none" stroke="#1f2328" stroke-width="0.8">
      <animate attributeName="rx" values="3;130;3" dur="6s" repeatCount="indefinite" begin="2.25s"/>
      <animate attributeName="ry" values="3;85;3" dur="6s" repeatCount="indefinite" begin="2.25s"/>
      <animate attributeName="opacity" values="1;0;1" dur="6s" repeatCount="indefinite" begin="2.25s"/>
    </ellipse>
    <ellipse cx="680" cy="100" fill="none" stroke="#1f2328" stroke-width="0.8">
      <animate attributeName="rx" values="3;130;3" dur="6s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="ry" values="3;85;3" dur="6s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="opacity" values="1;0;1" dur="6s" repeatCount="indefinite" begin="3s"/>
    </ellipse>
    <ellipse cx="680" cy="100" fill="none" stroke="#1f2328" stroke-width="0.8">
      <animate attributeName="rx" values="3;130;3" dur="6s" repeatCount="indefinite" begin="3.75s"/>
      <animate attributeName="ry" values="3;85;3" dur="6s" repeatCount="indefinite" begin="3.75s"/>
      <animate attributeName="opacity" values="1;0;1" dur="6s" repeatCount="indefinite" begin="3.75s"/>
    </ellipse>
    <ellipse cx="680" cy="100" fill="none" stroke="#1f2328" stroke-width="0.8">
      <animate attributeName="rx" values="3;130;3" dur="6s" repeatCount="indefinite" begin="4.5s"/>
      <animate attributeName="ry" values="3;85;3" dur="6s" repeatCount="indefinite" begin="4.5s"/>
      <animate attributeName="opacity" values="1;0;1" dur="6s" repeatCount="indefinite" begin="4.5s"/>
    </ellipse>
    <ellipse cx="680" cy="100" fill="none" stroke="#1f2328" stroke-width="0.8">
      <animate attributeName="rx" values="3;130;3" dur="6s" repeatCount="indefinite" begin="5.25s"/>
      <animate attributeName="ry" values="3;85;3" dur="6s" repeatCount="indefinite" begin="5.25s"/>
      <animate attributeName="opacity" values="1;0;1" dur="6s" repeatCount="indefinite" begin="5.25s"/>
    </ellipse>
  </g>

  <!-- Dot field / starfield -->
  <g opacity="0.2">
    <circle cx="30" cy="30" r="1.2" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="45" r="0.8" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="90" cy="25" r="1" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="120" cy="55" r="0.6" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle cx="45" cy="70" r="1.1" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="80" cy="80" r="0.7" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
    <circle cx="110" cy="35" r="0.9" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="2.9s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="35" cy="110" r="1.3" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="70" cy="130" r="0.5" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite" begin="1.6s"/>
    </circle>
    <circle cx="100" cy="150" r="1" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="3.3s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="50" cy="160" r="0.8" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="130" cy="90" r="0.6" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="25" cy="175" r="1.1" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <circle cx="115" cy="170" r="0.7" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="85" cy="105" r="0.9" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="2.3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="140" cy="140" r="1.2" fill="#1f2328">
      <animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
  </g>

  <!-- Sine wave / oscilloscope lines -->
  <g opacity="0.08">
    <path d="M0,100 Q50,60 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100" 
          stroke="#1f2328" stroke-width="1" fill="none">
      <animate attributeName="d" 
               values="M0,100 Q50,60 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100;
                       M0,100 Q50,140 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100;
                       M0,100 Q50,60 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100"
               dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M0,100 Q50,80 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100" 
          stroke="#1f2328" stroke-width="0.5" fill="none">
      <animate attributeName="d" 
               values="M0,100 Q50,80 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100;
                       M0,100 Q50,120 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100;
                       M0,100 Q50,80 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100"
               dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Perspective grid lines -->
  <g opacity="0.05" stroke="#1f2328" stroke-width="0.5">
    <line x1="300" y1="200" x2="800" y2="160"/>
    <line x1="300" y1="200" x2="800" y2="140"/>
    <line x1="300" y1="200" x2="800" y2="120"/>
    <line x1="300" y1="200" x2="800" y2="100"/>
    <line x1="300" y1="200" x2="800" y2="80"/>
    <line x1="300" y1="200" x2="800" y2="60"/>
    <line x1="300" y1="200" x2="800" y2="40"/>
  </g>
  <g opacity="0.03" stroke="#1f2328" stroke-width="0.3">
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>

  <!-- Decorative border lines -->
  <line x1="0" y1="2" x2="800" y2="2" stroke="#1f2328" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="198" x2="800" y2="198" stroke="#1f2328" stroke-width="1" opacity="0.2"/>

  <!-- Blinking cursor dots -->
  <rect x="10" y="1" width="6" height="2" fill="#1f2328" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0;0.4" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="784" y="197" width="6" height="2" fill="#1f2328" opacity="0.4">
    <animate attributeName="opacity" values="0;0.4;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Left side vertical decorative line -->
  <line x1="180" y1="65" x2="180" y2="175" stroke="#1f2328" stroke-width="1" opacity="0.15"/>
  <line x1="183" y1="70" x2="183" y2="170" stroke="#1f2328" stroke-width="0.5" opacity="0.08"/>

  <!-- Main text: Real Name (textLength ensures consistent width across renderers) -->
  <text x="200" y="95" class="name-text" text-anchor="start" textLength="260" lengthAdjust="spacing">Harald Lapp</text>

  <!-- Animated typing cursor positioned right after text (200 + 260 + 4 = 464) -->
  <rect x="464" y="74" width="3" height="26" fill="#1f2328" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Handle text -->
  <text x="200" y="130" class="handle-text" text-anchor="start">// aurora</text>

  <!-- Small demoscene-style tagline -->
  <text x="200" y="158" font-family="'Courier New', monospace" font-size="10" fill="#656d76" letter-spacing="3px" opacity="0.6">
    &lt;code • music • creativity&gt;
  </text>

  <!-- Decorative dot row -->
  <g opacity="0.06" font-family="'Courier New', monospace" font-size="8" fill="#1f2328">
    <text x="200" y="180">· · · · · · · · · · · · · · · · · · · · · · · · · · ·</text>
  </g>

</svg>